<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="30 秒網頁打地鼠：金髮小勇者衝向身旁冒出的地鼠一槌敲下，小心炸彈！">
<title>咚咚打地鼠</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;800&family=Lilita+One&display=swap">
<style>
:root{
  color-scheme:light;
  --sky:#aee3ff; --sky2:#e6f7ff;
  --grass:#4fae5c; --grass-dk:#2f8545; --grass-lt:#86d175;
  --soil:#5a321b; --soil-lt:#8a5530; --pit:#241208;
  --hammer:#d8472d; --hero:#f6c326; --ink:#2b1a10; --cream:#fff8e7;
  --display:"Lilita One","Chiron GoRound TC","Microsoft JhengHei",system-ui,sans-serif;
  --body:"Chiron GoRound TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--grass-dk);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{position:relative;height:100%;display:flex;flex-direction:column;background:linear-gradient(var(--sky2),var(--sky) 60%,#d7f2c9)}

/* HUD */
.hud{position:relative;z-index:900;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px 16px 0}
.chip{background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:4px 14px 6px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:baseline;gap:8px;min-width:88px;justify-content:center}
.chip small{font-size:13px;font-weight:800;letter-spacing:.08em}
.chip b{font-family:var(--display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1}
.chip.time.low b{color:var(--hammer);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.icon-btn{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);font-size:20px;width:46px;cursor:pointer;font-family:var(--body)}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.timebar{position:relative;z-index:900;width:min(560px,calc(100% - 32px));height:12px;margin:10px auto 0;border:3px solid var(--ink);border-radius:99px;background:var(--cream);overflow:hidden;box-sizing:border-box}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hammer),var(--hero));transform-origin:left;transition:transform .2s linear}

/* scene */
.scene{position:relative;z-index:1;flex:1;min-height:0;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.95;animation:drift linear infinite;z-index:0}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:160%;left:15%;bottom:20%}
.cloud::after{width:40%;height:130%;right:12%;bottom:25%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
#ground{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.field{position:absolute;inset:0;z-index:2;cursor:pointer}

.hole{position:absolute;pointer-events:none}
.pit{position:absolute;left:8%;right:8%;bottom:12%;height:30%;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,var(--pit) 55%,var(--soil) 72%);box-shadow:inset 0 6px 10px rgba(0,0,0,.6)}
.mound{position:absolute;left:0;right:0;bottom:6%;height:34%;border-radius:50%;background:radial-gradient(ellipse at 50% 30%,var(--soil-lt),var(--soil) 70%);border:3px solid var(--ink);box-sizing:border-box;z-index:0}
.lip{position:absolute;left:3%;right:3%;bottom:6%;height:19%;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(var(--soil-lt),var(--soil));border:3px solid var(--ink);border-top:none;z-index:3;box-sizing:border-box}
.lip::before,.lip::after{content:"";position:absolute;top:-9px;height:11px;background:var(--grass-dk);border-radius:50% 50% 0 0}
.lip::before{left:-5%;width:14%}
.lip::after{right:-2%;width:10%}
.clip{position:absolute;left:14%;right:14%;bottom:24%;height:100%;overflow:hidden;z-index:2;border-radius:0 0 40% 40%/0 0 16% 16%}
.pit{z-index:1}
.mole{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(105%);transition:transform .16s cubic-bezier(.3,1.6,.6,1)}
.mole svg{width:100%;height:100%;display:block;overflow:visible}
.hole.up .mole{transform:translateY(10%)}
.hole.hit .mole{transform:translateY(42%) scaleY(.8);transition:transform .07s}
.hole.down .mole{transform:translateY(105%);transition:transform .22s ease-in}
.mole .eyes-x{display:none}
.hole.hit .mole .eyes-open{display:none}
.hole.hit .mole .eyes-x{display:inline}
.hole .key{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);font-family:var(--display);font-size:13px;color:#fff;opacity:.55;z-index:4}

/* hero */
.hero{position:absolute;left:0;top:0;pointer-events:none;transition:transform .09s ease-out;will-change:transform}
.hero.walk{transition:transform .5s cubic-bezier(.4,0,.3,1)}
.hero .shadow{position:absolute;left:22%;right:22%;bottom:-3%;height:9%;border-radius:50%;background:rgba(20,50,20,.35)}
.hero .body{position:absolute;inset:0;transform-origin:50% 100%}
.hero img{position:absolute;inset:0;width:100%;height:100%;display:none}
.hero img.on{display:block}
.hero.flip img{transform:scaleX(-1)}
.hero.walk .body{animation:hop .25s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-6%)}}
.hero.impact .body{animation:squash .2s ease-out}
@keyframes squash{0%{transform:scale(1.08,.92)}100%{transform:scale(1)}}
/* bomb: charred hero */
.hero img{transition:filter .7s ease-out}
.hero.burnt img{filter:brightness(.13) saturate(0) contrast(1.4);transition:filter .04s}
.hero.burnt .body{animation:wobble .45s ease-in-out 3}
@keyframes wobble{25%{transform:rotate(-5deg) translateX(-2%)}75%{transform:rotate(5deg) translateX(2%)}}
.soot,.dizzy{position:absolute;display:none;pointer-events:none}
.hero.burnt .soot,.hero.burnt .dizzy{display:block}
.soot{inset:0}
.hero.flip .soot{transform:scaleX(-1)}
.soot i{position:absolute;top:30.3%;width:7.5%;height:5.6%;margin:-2.8% 0 0 -3.75%;background:#fff;border-radius:50%;animation:blink 1.3s steps(1) forwards}
.soot i:nth-child(1){left:42.2%}
.soot i:nth-child(2){left:56.1%}
.soot i::after{content:"";position:absolute;left:35%;top:30%;width:30%;height:40%;background:#000;border-radius:50%}
@keyframes blink{0%,30%,40%,70%,78%,100%{transform:scaleY(1)}35%,74%{transform:scaleY(.1)}}
/* frazzled hair tufts */
.soot b{position:absolute;top:4%;width:10%;height:9%;background:#1b1b1b;clip-path:polygon(50% 0,62% 38%,100% 20%,72% 55%,96% 90%,50% 70%,4% 90%,28% 55%,0 20%,38% 38%)}
.soot b:nth-child(3){left:33%;transform:rotate(-20deg)}
.soot b:nth-child(4){left:46%;top:1%}
.soot b:nth-child(5){left:59%;transform:rotate(20deg)}
.dizzy{left:28%;top:6%;width:44%;height:12%}
.dizzy svg{position:absolute;left:40%;top:30%;width:20%;animation:orbit .8s linear infinite}
.dizzy svg:nth-child(2){animation-delay:-.27s}
.dizzy svg:nth-child(3){animation-delay:-.53s}
@keyframes orbit{0%{transform:translate(-160%,0) scale(.8)}25%{transform:translate(0,55%) scale(1.1)}50%{transform:translate(160%,0) scale(.8)}75%{transform:translate(0,-55%) scale(.5)}100%{transform:translate(-160%,0) scale(.8)}}
.smoke{width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;background:#4a4a4a;animation:smoke 1s ease-out forwards}
@keyframes smoke{from{transform:scale(.4);opacity:.85}to{transform:translate(var(--dx),-80px) scale(2.3);opacity:0}}
.kaboom{width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;background:radial-gradient(circle,#fff 0,#ffe066 22%,#ff8a2a 45%,rgba(70,45,30,.85) 62%,rgba(70,45,30,0) 70%);animation:boomIn .5s ease-out forwards}
.bubble{position:absolute;left:62%;top:2%;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:4px 10px;font-weight:800;font-size:15px;white-space:nowrap;opacity:0;transform:scale(.4);transition:.2s;z-index:2}
.bubble.show{opacity:1;transform:scale(1)}

/* fx */
.fx{position:absolute;pointer-events:none;z-index:5000}
.pop{font-family:var(--display);font-size:34px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke;text-shadow:0 3px 0 var(--ink);animation:rise .8s ease-out forwards;white-space:nowrap}
.pop.gold{color:var(--hero)}
.pop.bad{color:var(--hammer)}
@keyframes rise{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-20px) scale(1.25);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}
.star{width:18px;height:18px;animation:fly .6s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.3);opacity:0}}
.dust{width:34px;height:20px;border-radius:50%;background:#e2cda6;animation:puff .5s ease-out forwards}
@keyframes puff{from{transform:translate(-50%,-50%) scale(.4);opacity:.95}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.7);opacity:0}}
.boom{width:80px;height:80px;margin:-40px 0 0 -40px;animation:boomIn .35s ease-out forwards}
@keyframes boomIn{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.combo{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(34px,7vw,60px);color:var(--hero);-webkit-text-stroke:3px var(--ink);paint-order:stroke;text-shadow:0 5px 0 var(--ink);z-index:5100;pointer-events:none;animation:comboIn .9s ease-out forwards;white-space:nowrap}
@keyframes comboIn{0%{transform:translate(-50%,-50%) scale(.2) rotate(-12deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.2) rotate(4deg);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.flash{position:fixed;inset:0;background:#fff;z-index:950;pointer-events:none;animation:flash .3s forwards}
@keyframes flash{from{opacity:.8}to{opacity:0}}

/* overlays */
.overlay{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(43,26,16,.35);backdrop-filter:blur(2px)}
.card{position:relative;background:var(--cream);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:22px 24px 24px;max-width:460px;width:100%;display:flex;gap:16px;align-items:center;animation:cardIn .45s cubic-bezier(.3,1.5,.6,1);box-sizing:border-box}
@keyframes cardIn{from{transform:scale(.6) translateY(40px);opacity:0}}
.card img{width:36%;flex:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.card .txt{flex:1;min-width:0}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,8vw,46px);margin:0;line-height:1.05;color:var(--hammer);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke;text-shadow:0 3px 0 var(--ink);text-wrap:balance}
.card h1 span{color:var(--hero)}
.card p{margin:10px 0 0;font-size:15px;line-height:1.6;font-weight:500}
.legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.legend div{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:800}
.legend svg{width:30px;height:30px}
.big{margin-top:16px;font-family:var(--body);font-weight:800;font-size:22px;letter-spacing:.1em;padding:10px 26px 12px;border:4px solid var(--ink);border-radius:18px;background:var(--hero);color:var(--ink);box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .08s}
.big:hover{transform:translateY(-2px) rotate(-1.5deg)}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.big:focus-visible,.icon-btn:focus-visible{outline:4px solid #fff;outline-offset:3px}
.final{font-family:var(--display);font-size:64px;line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
.final small{font-family:var(--body);font-size:16px;font-weight:800;margin-left:4px}
.stats{display:flex;gap:14px;font-size:14px;font-weight:800;margin-top:6px;flex-wrap:wrap}
.badge{display:inline-block;margin-top:8px;background:var(--hammer);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:2px 10px;font-weight:800;font-size:14px;transform:rotate(-3deg)}
.countdown{position:absolute;inset:0;z-index:990;display:flex;align-items:center;justify-content:center;pointer-events:none;font-family:var(--display);font-size:min(34vw,180px);color:var(--hero);-webkit-text-stroke:5px var(--ink);paint-order:stroke;text-shadow:0 10px 0 var(--ink)}
.countdown span{animation:cd .8s ease-out forwards}
@keyframes cd{0%{transform:scale(2.2);opacity:0}30%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}

@media (max-width:640px){
  .hud{gap:6px}
  .chip{min-width:64px;padding:3px 9px 5px;gap:5px}
  .chip small{font-size:12px}
  .chip b{font-size:22px}
  .card{flex-direction:column;text-align:center}
  .card img{width:40%}
  .legend,.stats{justify-content:center}
  .bubble{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .cloud{display:none}
}
</style>
</head>

  el.innerHTML = `<div class="mound"></div><div class="pit"></div><div class="clip"><div class="mole"></div></div><div class="lip"></div><div class="key">${i + 1}</div>`;
  scene.appendChild(el);
  return { el, mole: el.querySelector('.mole'), angle: a, kind: null, timer: 0, active: false, x: 0, y: 0, size: 0 };
});

/* hero */
const hero = document.createElement('div');
hero.className = 'hero';
hero.innerHTML = '<div class="shadow"></div><div class="body">' +
  Object.keys(SPR).map(k => `<img data-k="${k}" src="${SPR[k]}" alt="">`).join('') +
  '<div class="soot"><i></i><i></i><b></b><b></b><b></b></div>' +
  '<div class="dizzy">' + '<svg viewBox="0 0 24 24"><use href="#star"/></svg>'.repeat(3) + '</div>' +
  '</div><div class="bubble" id="bubble">看我的！</div>';
scene.appendChild(hero);
const heroImgs = {}; hero.querySelectorAll('img').forEach(im => heroImgs[im.dataset.k] = im);
const bubble = $('bubble');
function pose(k) { for (const n in heroImgs) heroImgs[n].classList.toggle('on', n === k); }
pose('idle');

let W = 0, H = 0, heroH = 0, heroW = 0, home = { x: 0, y: 0 }, heroPos = { x: 0, y: 0 };

function placeHero(x, y, walk) {
  x = Math.max(heroW * 0.2, Math.min(W - heroW * 0.2, x));
  y = Math.max(heroH * 0.75, Math.min(H - 4, y));
  heroPos = { x, y };
  hero.classList.toggle('walk', !!walk);
  hero.style.transform = `translate(${x - heroW / 2}px,${y - heroH}px)`;
  hero.style.zIndex = Math.round(y);
}

function layout() {
  W = scene.clientWidth; H = scene.clientHeight;
  const portrait = W / H < 0.9;
  const cx = W / 2, cy = H * (portrait ? 0.56 : 0.58);
  const rx = W * (portrait ? 0.36 : 0.33), ry = H * (portrait ? 0.27 : 0.3);
  heroH = Math.min(H * (portrait ? 0.3 : 0.42), W * (portrait ? 0.62 : 0.4));
  heroW = heroH * SPR_ASPECT;
  const base = Math.min(W * (portrait ? 0.24 : 0.13), H * 0.2);
  holes.forEach(h => {
    const r = h.angle * Math.PI / 180;
    h.x = cx + Math.cos(r) * rx;
    h.y = cy + Math.sin(r) * ry;
    const depth = (h.y - (cy - ry)) / (2 * ry);
    h.size = base * (0.78 + 0.4 * depth);
    Object.assign(h.el.style, { width: h.size + 'px', height: h.size + 'px', left: h.x - h.size / 2 + 'px', top: h.y - h.size * 0.78 + 'px', zIndex: Math.round(h.y) });
  });
  hero.style.width = heroW + 'px'; hero.style.height = heroH + 'px';
  home = { x: cx, y: cy + ry * 0.18 };
  placeHero(home.x, home.y, false);
  drawGround(cy, rx, ry);
}

function drawGround(cy, rx, ry) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const horizon = Math.max(24, cy - ry - H * 0.2);
  // hills
  g.fillStyle = '#9fd98a';
  g.beginPath(); g.moveTo(0, horizon);
  for (let x = 0; x <= W; x += 20) g.lineTo(x, horizon - 18 - Math.sin(x / 90) * 14 - Math.sin(x / 37) * 5);
  g.lineTo(W, horizon + 40); g.lineTo(0, horizon + 40); g.fill();
  // meadow
  const grd = g.createLinearGradient(0, horizon, 0, H);
  grd.addColorStop(0, '#7cc86a'); grd.addColorStop(.5, '#55b25e'); grd.addColorStop(1, '#3e9a4f');
  g.fillStyle = grd; g.fillRect(0, horizon, W, H - horizon);
  // mown stripes following perspective
  g.save(); g.globalAlpha = .08; g.fillStyle = '#fff';
  for (let i = -8; i <= 8; i += 2) {
    g.beginPath();
    g.moveTo(W / 2 + i * W * 0.02, horizon);
    g.lineTo(W / 2 + (i + 1) * W * 0.02, horizon);
    g.lineTo(W / 2 + (i + 1) * W * 0.16, H);
    g.lineTo(W / 2 + i * W * 0.16, H);
    g.fill();
  }
  g.restore();
  // worn dirt circle where the hero plays
  const rg = g.createRadialGradient(W / 2, cy, 0, W / 2, cy, 1);
  g.save(); g.translate(W / 2, cy); g.scale(rx * 1.35, ry * 1.35); g.translate(-W / 2, -cy);
  rg.addColorStop(0, 'rgba(160,210,110,.55)'); rg.addColorStop(.8, 'rgba(160,210,110,.2)'); rg.addColorStop(1, 'rgba(160,210,110,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(W / 2, cy, 1, 0, Math.PI * 2); g.fill(); g.restore();
  // tufts, flowers, pebbles (seeded so they stay put)
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const n = Math.round(W * H / 5000);
  for (let i = 0; i < n; i++) {
    const y = horizon + 10 + rnd() * (H - horizon), x = rnd() * W, s = 0.5 + (y - horizon) / (H - horizon);
    const nearHole = holes.some(h => Math.hypot((h.x - x) / h.size, (h.y - y) / (h.size * 0.5)) < 0.8);
    if (nearHole) continue;
    const t = rnd();
    if (t < 0.7) {
      g.strokeStyle = rnd() < .5 ? '#2f8545' : '#9ad97a'; g.lineWidth = 2 * s; g.lineCap = 'round';
      g.beginPath();
      for (let k = -1; k <= 1; k++) { g.moveTo(x, y); g.quadraticCurveTo(x + k * 3 * s, y - 6 * s, x + k * 6 * s, y - 10 * s); }
      g.stroke();
    } else if (t < 0.88) {
      const cols = ['#fff', '#ffd84a', '#f59aa8'];
      g.fillStyle = cols[Math.floor(rnd() * 3)];
      for (let k = 0; k < 5; k++) { g.beginPath(); g.arc(x + Math.cos(k * 1.26) * 3 * s, y + Math.sin(k * 1.26) * 3 * s, 2.4 * s, 0, 7); g.fill(); }
      g.fillStyle = '#f3b61f'; g.beginPath(); g.arc(x, y, 1.8 * s, 0, 7); g.fill();
    } else {
      g.fillStyle = 'rgba(90,70,50,.35)'; g.beginPath(); g.ellipse(x, y, 4 * s, 2.4 * s, 0, 0, 7); g.fill();
    }
  }
}

/* ---------- storage ---------- */
let best = 0;
try { best = +localStorage.getItem('whackBest') || 0; } catch (e) {}
$('best').textContent = best;

/* ---------- audio ---------- */
let ac = null, muted = false;
try { muted = localStorage.getItem('whackMute') === '1'; } catch (e) {}
$('mute').textContent = muted ? '🔇' : '🔊';
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); return ac; }
function tone(f1, f2, dur, type = 'square', vol = .18, delay = 0) {
  if (muted || !audio()) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol = .25, freq = 800) {
  if (muted || !audio()) return;
  const len = ac.sampleRate * dur, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sfx = {
  bonk: () => { tone(420, 90, .14, 'square', .16); noise(.06, .2, 1800); },
  gold: () => { [880, 1175, 1568].forEach((f, i) => tone(f, f, .12, 'triangle', .14, i * .07)); noise(.05, .15, 2000); },
  boom: () => { noise(.5, .5, 500); tone(120, 40, .4, 'sawtooth', .2); },
  thud: () => { tone(160, 60, .1, 'sine', .2); noise(.06, .12, 600); },
  whoosh: () => noise(.07, .06, 3000),
  pop: () => tone(300, 600, .07, 'sine', .06),
  tick: () => tone(1000, 1000, .05, 'sine', .08),
  go: () => { tone(523, 523, .1, 'square', .1); tone(784, 784, .18, 'square', .1, .1); },
  end: () => [784, 659, 523, 1046].forEach((f, i) => tone(f, f, .16, 'triangle', .15, i * .12)),
};
$('mute').addEventListener('click', () => {
  muted = !muted; $('mute').textContent = muted ? '🔇' : '🔊';
  try { localStorage.setItem('whackMute', muted ? '1' : '0'); } catch (e) {}
});

/* ---------- fx ---------- */
function fx(cls, x, y, html = '', vars = {}) {
  const el = document.createElement('div');
  el.className = 'fx ' + cls; el.style.left = x + 'px'; el.style.top = y + 'px'; el.innerHTML = html;
  for (const k in vars) el.style.setProperty(k, vars[k]);
  scene.appendChild(el);
  el.addEventListener('animationend', () => el.remove());
  setTimeout(() => el.remove(), 1500);
}
function burst(x, y, n = 6) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n + Math.random() * .5, r = 50 + Math.random() * 30;
    fx('star', x - 9, y - 9, '<svg viewBox="0 0 24 24"><use href="#star"/></svg>', { '--dx': Math.cos(a) * r + 'px', '--dy': Math.sin(a) * r - 20 + 'px' });
  }
}
function dust(x, y, n = 5) { for (let i = 0; i < n; i++) fx('dust', x, y, '', { '--dx': (i - (n - 1) / 2) * 20 + 'px', '--dy': -8 - Math.random() * 16 + 'px' }); }
const cheers = ['咚！', '抓到你了～', '太慢啦！', '嘿咻！', '再來再來！', '看招！'];
let bubbleT;
function say(t) { bubble.textContent = t; bubble.classList.add('show'); clearTimeout(bubbleT); bubbleT = setTimeout(() => bubble.classList.remove('show'), 900); }

/* ---------- hero swing ---------- */
let swingT = [], homeT = 0;
function heroSwing(tx, ty, onImpact) {
  swingT.forEach(clearTimeout); swingT = []; clearTimeout(homeT);
  const faceRight = tx > heroPos.x + heroW * 0.05 || (Math.abs(tx - heroPos.x) <= heroW * 0.05 && hero.classList.contains('flip'));
  hero.classList.toggle('flip', faceRight);
  const dir = faceRight ? -1 : 1;
  const fx_ = tx + (0.5 - HEAD.x) * heroW * dir;
  const fy_ = ty + (1 - HEAD.y) * heroH;
  pose('windup');
  sfx.whoosh();
  placeHero(fx_, fy_, false);
  swingT.push(setTimeout(() => {
    pose('smash');
    hero.classList.remove('impact'); void hero.offsetWidth; hero.classList.add('impact');
    onImpact && onImpact();
  }, 90));
  swingT.push(setTimeout(() => pose(running ? 'idle' : 'win'), 330));
  homeT = setTimeout(goHome, 1400);
}
function goHome() {
  if (Math.hypot(heroPos.x - home.x, heroPos.y - home.y) < 4) return;
  hero.classList.toggle('flip', home.x > heroPos.x);
  placeHero(home.x, home.y, true);
}

/* ---------- game ---------- */
let running = false, score = 0, combo = 0, maxCombo = 0, hits = 0, swings = 0, timeLeft = GAME_TIME, startAt = 0, spawnT = 0, raf = 0, lastSec = GAME_TIME;

function setHUD() {
  $('score').textContent = score; $('combo').textContent = combo;
  $('time').textContent = Math.ceil(timeLeft);
  $('timeChip').classList.toggle('low', timeLeft <= 5 && running);
  $('bar').style.transform = `scaleX(${Math.max(0, timeLeft / GAME_TIME)})`;
}
const difficulty = () => Math.min(1, (GAME_TIME - timeLeft) / GAME_TIME);

function spawn() {
  if (!running) return;
  const d = difficulty();
  const maxUp = 1 + Math.floor(d * 2.6);
  const free = holes.filter(h => !h.active);
  if (holes.length - free.length < maxUp && free.length) {
    const h = free[Math.floor(Math.random() * free.length)];
    const r = Math.random();
    // mostly moles; never more than one bomb out at a time, and none in the opening seconds
    const bombOut = holes.some(hh => hh.active && hh.kind === 'bomb');
    const bombOk = !bombOut && performance.now() - startAt > 3000;
    const kind = r < .1 ? 'gold' : (bombOk && r < .2 + d * .06) ? 'bomb' : 'mole';
    popUp(h, kind, (kind === 'gold' ? 800 : 1250) - d * 450);
  }
  spawnT = setTimeout(spawn, 720 - d * 360 + Math.random() * 260);
}
function popUp(h, kind, stay) {
  h.kind = kind; h.active = true;
  h.mole.innerHTML = MOLE_SVG(kind);
  h.el.classList.remove('hit', 'down'); void h.el.offsetWidth; h.el.classList.add('up');
  sfx.pop();
  h.timer = setTimeout(() => hide(h, true), stay);
}
function hide(h, escaped) {
  clearTimeout(h.timer);
  h.el.classList.remove('up'); h.el.classList.add('down');
  if (escaped && running && h.kind !== 'bomb' && combo > 0) { combo = 0; setHUD(); }
  setTimeout(() => { h.active = false; h.el.classList.remove('down', 'hit'); }, 240);
}

// blown up by a bomb: charred black, smoking, dizzy, can't swing for a moment
let stunnedUntil = 0, burnT = 0;
function burnHero() {
  swingT.forEach(clearTimeout); swingT = []; clearTimeout(burnT);
  pose('smash');
  hero.classList.remove('impact');
  hero.classList.add('burnt');
  stunnedUntil = performance.now() + 1100;
  say('咳咳…');
  for (let i = 0; i < 7; i++) setTimeout(() => {
    fx('smoke', heroPos.x + (Math.random() - .5) * heroW * .3, heroPos.y - heroH * (.75 + Math.random() * .1), '', { '--dx': (Math.random() - .5) * 60 + 'px' });
  }, i * 140);
  burnT = setTimeout(unburn, 1300);
}
function unburn() {
  clearTimeout(burnT);
  hero.classList.remove('burnt');
  pose(running ? 'idle' : 'win');
}

function whack(h, px, py) {
  if (!running) return;
  if (performance.now() < stunnedUntil) return;
  swings++;
  const isUp = h && h.el.classList.contains('up');
  const tx = h ? h.x : px, ty = h ? h.y - h.size * 0.32 : py;
  if (!isUp) {
    combo = 0; setHUD();
    heroSwing(tx, ty, () => { sfx.thud(); dust(tx, h ? h.y : py, 3); });
    return;
  }
  // resolve immediately so a mole can't slip away during the swing
  clearTimeout(h.timer);
  const kind = h.kind;
  h.el.classList.remove('up'); h.el.classList.add('hit');
  setTimeout(() => hide(h, false), 330);
  let pts = 0;
  if (kind === 'bomb') { score = Math.max(0, score - 3); combo = 0; }
  else { combo++; hits++; maxCombo = Math.max(maxCombo, combo); pts = (kind === 'gold' ? 3 : 1) + (combo >= 10 ? 2 : combo >= 5 ? 1 : 0); score += pts; }
  setHUD();
  heroSwing(tx, ty, () => {
    fx('boom', tx, ty, '<svg viewBox="0 0 100 100" width="100%" height="100%"><use href="#burst"/></svg>');
    if (kind === 'bomb') {
      sfx.boom();
      fx('kaboom', tx, ty);
      fx('pop bad', tx, ty - 40, '轟！−3');
      const fl = document.createElement('div'); fl.className = 'flash'; document.body.appendChild(fl); setTimeout(() => fl.remove(), 350);
      scene.classList.remove('shake'); void scene.offsetWidth; scene.classList.add('shake');
      burnHero();
      return;
    }
    kind === 'gold' ? sfx.gold() : sfx.bonk();
    fx('pop' + (kind === 'gold' ? ' gold' : ''), tx, ty - 30, '+' + pts);
    burst(tx, ty, kind === 'gold' ? 10 : 6);
    dust(tx, h.y);
    if (combo > 0 && combo % 5 === 0) {
      const c = document.createElement('div'); c.className = 'combo'; c.textContent = combo + ' 連擊！';
      scene.appendChild(c); setTimeout(() => c.remove(), 950);
      say(combo >= 10 ? '停不下來啦！' : '手感火熱！');
    } else if (Math.random() < .25) say(cheers[Math.floor(Math.random() * cheers.length)]);
  });
}

function nearestHole(x, y) {
  let bestH = null, bestD = Infinity;
  holes.forEach(h => {
    // aim point sits between the pit and a popped-up mole's head
    const d = Math.hypot((x - h.x) / h.size, (y - (h.y - h.size * 0.3)) / (h.size * 0.9));
    if (d < bestD) { bestD = d; bestH = h; }
  });
  return bestD < 0.75 ? bestH : null;
}

field.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const r = scene.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  whack(nearestHole(x, y), x, y);
});
window.addEventListener('keydown', e => {
  const n = +e.key;
  if (running && n >= 1 && n <= holes.length) whack(holes[n - 1]);
});

function loop() {
  if (!running) return;
  timeLeft = Math.max(0, GAME_TIME - (performance.now() - startAt) / 1000);
  const s = Math.ceil(timeLeft);
  if (s !== lastSec) { lastSec = s; if (s <= 5 && s > 0) sfx.tick(); }
  setHUD();
  if (timeLeft <= 0) return endGame();
  raf = requestAnimationFrame(loop);
}
function countdown(done) {
  const cd = $('countdown'), seq = ['3', '2', '1', '咚！'];
  let i = 0;
  (function step() {
    if (i >= seq.length) { cd.innerHTML = ''; return done(); }
    cd.innerHTML = `<span>${seq[i]}</span>`;
    i === seq.length - 1 ? sfx.go() : sfx.tick();
    i++; setTimeout(step, i === seq.length ? 500 : 650);
  })();
}
function startGame() {
  audio();
  $('startOv').hidden = true; $('endOv').hidden = true;
  holes.forEach(h => { clearTimeout(h.timer); h.active = false; h.el.classList.remove('up', 'hit', 'down'); });
  score = 0; combo = 0; maxCombo = 0; hits = 0; swings = 0; timeLeft = GAME_TIME; lastSec = GAME_TIME;
  pose('idle'); hero.classList.remove('flip'); placeHero(home.x, home.y, true);
  setHUD();
  countdown(() => { running = true; startAt = performance.now(); say('看我的！'); spawn(); raf = requestAnimationFrame(loop); });
}
function endGame() {
  running = false;
  clearTimeout(spawnT); cancelAnimationFrame(raf);
  holes.forEach(h => { if (h.active) hide(h, false); });
  setHUD(); sfx.end();
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('whackBest', best); } catch (e) {} }
  $('best').textContent = best;
  swingT.forEach(clearTimeout); clearTimeout(homeT);
  unburn(); stunnedUntil = 0;
  pose('win'); hero.classList.remove('flip'); placeHero(home.x, home.y, true);
  say('耶～收工！');
  $('finalScore').textContent = score;
  $('stHits').textContent = hits;
  $('stCombo').textContent = maxCombo;
  $('stAcc').textContent = swings ? Math.round(hits / swings * 100) + '%' : '0%';
  $('endTitle').textContent = score >= 40 ? '地鼠剋星！' : score >= 25 ? '超厲害！' : score >= 12 ? '不錯喔！' : '時間到！';
  $('newBest').hidden = !isBest || score === 0;
  setTimeout(() => { $('endOv').hidden = false; $('againBtn').focus(); }, 900);
}
$('startBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);

let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(layout, 80); });
layout();
// a few moles peeking out behind the start card
[[0, 'mole'], [3, 'gold'], [5, 'mole'], [6, 'bomb']].forEach(([i, k]) => { holes[i].mole.innerHTML = MOLE_SVG(k); holes[i].el.classList.add('up'); });
setHUD();
})();
</script>
